services:
  - type: web
    name: failed-training-ai-range
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: SESSION_TTL_MINUTES
        value: "60"
      - key: MAX_ACTIVE_SESSIONS
        value: "500"
      - key: CHAT_REQUESTS_PER_MINUTE
        value: "20"
      - key: AUTOMATION_RUNS_PER_MINUTE
        value: "3"
      - key: MAX_CONCURRENT_LLM_REQUESTS
        value: "8"
      - key: LLM_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: AUTOMATION_RUN_TIMEOUT_SECONDS
        value: "180"
